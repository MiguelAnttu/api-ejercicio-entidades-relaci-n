spring.application.name=apicrm

# Configuración del servidor web embebido Tomcat 11
server.port=8080

# Conexión JDBC a PostgreSQL (Base de datos: altair, Esquema predeterminado: crm)
spring.datasource.url=jdbc:postgresql://localhost:5432/altair?currentSchema=crm
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# Configuración de JPA / Hibernate (Jakarta Persistence)
spring.jpa.properties.hibernate.default_schema=crm
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
